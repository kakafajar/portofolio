<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Basic Meta -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title (Personal Branding SEO) -->
  <title>Fajar Herlambang | Web Developer & AI Specialist</title>

  <!-- Meta Description -->
  <meta name="description"
    content="Portfolio pribadi Fajar Herlambang, Web Developer dan AI Specialist. Mahasiswa Teknik Informatika Universitas Buana Perjuangan Karawang dengan minat pengembangan web dan Artificial Intelligence (AI).">

  <!-- Meta Keywords (opsional, aman untuk portfolio) -->
  <meta name="keywords"
    content="Fajar Herlambang, Web Developer, AI Specialist, Artificial Intelligence, Portfolio Web Developer, Mahasiswa Teknik Informatika">

  <!-- Canonical -->
  <link rel="canonical" href="https://fajarherlambang.netlify.app/">

  <!-- Open Graph (LinkedIn / WhatsApp) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Fajar Herlambang | Web Developer & AI Specialist">
  <meta property="og:description" content="Portfolio pribadi Fajar Herlambang, Web Developer dan AI Specialist.">
  <meta property="og:url" content="https://fajarherlambang.netlify.app/">
  <meta property="og:image" content="https://fajarherlambang.netlify.app/assets/hero.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fajar Herlambang | Web Developer & AI Specialist">
  <meta name="twitter:description" content="Portfolio pribadi Fajar Herlambang, Web Developer dan AI Specialist.">
  <meta name="twitter:image" content="https://fajarherlambang.netlify.app/assets/hero.jpg">

  <!-- Structured Data (Person Schema) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Fajar Herlambang",
    "jobTitle": "Web Developer & AI Specialist",
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "Universitas Buana Perjuangan Karawang"
    },
    "url": "https://domainkamu.com/",
    "sameAs": [
      "https://www.linkedin.com/in/fajar-herlambang-415561280/",
      "https://github.com/kakafajar",
      "https://www.instagram.com/kakafajar2/"
    ]
  }
  </script>

  <!-- Tailwind & UI Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js" defer></script>
  <script src="https://unpkg.com/heroicons@2.0.18/24/solid/min.js" defer></script>
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>


<body class="bg-gray-50 text-gray-900">

  <!-- Container untuk load section -->
  <div id="navbar"></div>
  <div id="hero"></div>
  <div id="about"></div>
  <div id="keahlian"></div>
  <div id="career"></div>
  <div id="projects"></div>
  <div id="sertifikat"></div>
  <div id="contact"></div>
  <div id="footer"></div>

  <!-- Image Lightbox Modal -->
  <div id="image-lightbox" class="fixed inset-0 z-[9999] hidden flex flex-col items-center justify-center bg-black/85 backdrop-blur-md p-4 transition-all duration-300 opacity-0 select-none">
    <button id="close-lightbox" class="absolute top-6 right-6 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full p-3 transition-all z-10 focus:outline-none" aria-label="Tutup Preview">
      <i class="fas fa-times text-2xl"></i>
    </button>
    <div class="relative max-w-5xl max-h-[90vh] flex flex-col items-center justify-center">
      <img id="lightbox-img" src="" alt="Preview Foto" class="max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl transition-transform duration-300 scale-95 border border-white/10">
      <p id="lightbox-caption" class="mt-4 text-white/90 text-sm md:text-base font-medium text-center bg-black/60 px-5 py-2 rounded-full backdrop-blur-md max-w-xl border border-white/10"></p>
    </div>
  </div>

  <!-- Script Loader -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="main.js"></script>
</body>

</html>
